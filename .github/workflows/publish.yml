name: Publish to npm

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Verify package and release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          PACKAGE_NAME="$(node -p 'require("./package.json").name')"
          PACKAGE_VERSION="$(node -p 'require("./package.json").version')"
          test "$PACKAGE_NAME" = "@beremaran/opencode-agent-tree"
          test "$RELEASE_TAG" = "v$PACKAGE_VERSION"

      - name: Install dependencies
        run: npm ci

      - name: Run checks
        run: npm run check

      - name: Inspect package contents
        run: npm pack --dry-run

      - name: Smoke-test packed tarball
        run: |
          npm pack
          mkdir -p /tmp/agent-tree-pkg
          tar -xzf *.tgz -C /tmp/agent-tree-pkg
          node --experimental-strip-types -e "import('/tmp/agent-tree-pkg/package/src/index.ts').then(m => { if (typeof m.default !== 'function') process.exit(1) })"

      - name: Publish package
        run: npm publish
